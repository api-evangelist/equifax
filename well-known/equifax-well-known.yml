generated: '2026-09-06'
method: probed
source: >-
  Live GET probes of the RFC 8615 well-known paths on every host in this record —
  the registrable domain and www, the developer portal, and each documented API
  environment base URL (https://api.equifax.com, https://api.sandbox.equifax.com,
  https://api.uat.equifax.com per https://developer.equifax.com/documentation).
provider: Equifax
providerId: equifax
note: >-
  Equifax serves NO well-known documents on any host probed. Every path returned 404
  (or a 301 to www on the apex). The apex/www 404s are Adobe Experience Manager HTML
  error pages, the developer portal 404s are Drupal HTML error pages, and the API
  gateway hosts return the Apigee JSON envelope {"efxErrorCode":"404.01"} — i.e. a
  real 404 from the gateway itself, not an SPA catch-all. No WellKnown, SecurityTxt,
  APICatalog or AgentCard pointer is emitted from this file: the probe records an
  absence, not a presence. Equifax DOES run a vulnerability disclosure program
  (https://hackerone.com/equifax, linked from its own site footer) — it simply does
  not advertise it at /.well-known/security.txt.
