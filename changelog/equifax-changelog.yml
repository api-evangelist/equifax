description: >-
  Equifax's US developer portal links "Release Notes" from every page footer, but that URL
  302s to the portal sign-in — the US changelog is gated. The only PUBLICLY readable,
  dated Equifax API changelog found is the UK developer portal's "What's new" page, which
  is served without authentication on the same Equifax platform. The entries below are
  transcribed from it verbatim in substance; they are Equifax UK API changes, and are
  labelled as such rather than presented as US platform history.
