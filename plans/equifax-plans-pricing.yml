specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Equifax
providerId: equifax
created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: https://developer.equifax.com/documentation
reconciled: true
tags:
  - Credit Bureau
  - Identity
  - Fraud Prevention
  - Consumer Data
  - Verification
description: >-
  Equifax publishes NO plans, tiers, prices or price list for any API product, in any
  region. Its own developer documentation says so directly: for the Live environment,
  "Monetization: This varies according to the API product. Please contact your Equifax
  representative", and "Usage constraints: Please contact your Equifax sales
  representative". Sandbox and Test are explicitly free. Commercial terms for production
  access are negotiated per product and per use case, gated by FCRA permissible purpose,
  and settled in a contract before an application is promoted to Live.
sources:
  - url: https://developer.equifax.com/documentation
    status: 200
    what: Environments section — the monetization statement for Sandbox, Test and Live.
  - url: https://developer.equifax.com/products/apiproducts
    status: 200
    what: 48 API product tiles; no product tile carries a price.
  - url: https://developer.equifax.com/help-support/getting-started
    status: 200
    what: '"contact us to discuss our requirements for access and integration" before Go Live.'
plan_count: 0
plan_count_note: >-
  An honest zero. Equifax publishes no purchasable tier of any kind — no free tier, no
  self-serve price, no rate card. This replaces a 2026-05-04 bulk-sweep artifact that
  listed four "plans" priced "contact sales"; those were product FAMILIES inferred from
  the product catalog, not plans Equifax publishes, and they are preserved below under
  productFamilies where they belong.
plans: []
free_tier:
  exists: true
  scope: non-production only
  detail: >-
    Sandbox and Test/UAT are free ("You don't incur any cost for testing the API in the
    Sandbox environment"; the same statement is made for UAT/Test), self-service after
    portal registration for Sandbox, and approval-gated for Test. There is no free or
    priced production tier.
pricing_model:
  published: false
  shape: per-product, per-use-case contract negotiated with an Equifax representative
  buyer_path: https://developer.equifax.com/contact
productFamilies:
  - id: equifax-credit-risk
    name: Credit Risk
    elements: [Consumer credit report, Credit attributes, Risk scores]
    example_products: [OneView Consumer Credit Report, Scores and Attributes, Prescreen One, Prequalification One]
  - id: equifax-identity-fraud
    name: Identity & Fraud
    elements: [Identity verification, Fraud signals, KYC compliance]
    example_products: [Digital Identity Trust, Document Verification, State-Issued ID Trust, FraudIQ Identity Scan Alert, AML Connect]
  - id: equifax-verification
    name: Verification Services (The Work Number)
    elements: [Income verification, Employment verification]
    example_products: [Verify Suite, Account Verification, Verification Exchange Canada, Alternative Employment and Income Data]
  - id: equifax-marketing-data
    name: Data-driven Marketing and Insights
    elements: [Consumer demographics, Audience segmentation, Property and asset data]
    example_products: [Wallet Insights, Property Insights, Address Insights, Asset View]
familyNote: >-
  Families are our grouping of the 48 product tiles Equifax lists at
  /products/apiproducts. They carry no price and are NOT plans; they are kept so the
  catalog retains the product shape it had before this file was corrected.
notes: >-
  Any price quoted for an Equifax API anywhere is a contract term, not a published one.
  Do not synthesize a rate card for this provider.
maintainers:
