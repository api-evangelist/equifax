description: >-
  Equifax publishes NO first-party client library for the Equifax Developer Portal API
  products in any public package registry. The portal's own integration path is
  hand-rolled HTTP plus an OAuth 2.0 client_credentials token, with a per-product OpenAPI
  YAML downloadable only after sign-in and a "Run in Postman" option on the signed-in API
  Reference tab. github.com/Equifax-Public holds exactly one repository
  (SecurityControlsFramework) and it is not an SDK. No `SDKs` pointer is emitted in
  apis.yml, because emitting one would credit Equifax with client libraries it does not
  publish.
