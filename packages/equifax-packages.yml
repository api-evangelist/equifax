gaps:
  - >-
    A consumer integrating an Equifax API product today writes the HTTP client themselves.
    The strongest thing Equifax could ship for developer ergonomics is a first-party SDK
    in any one language, or simply a publicly downloadable OpenAPI so generators can
    produce one.
